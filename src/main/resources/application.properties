spring.application.name=expense-tracker

# Database: PostgreSQL from compose.yaml.
# spring-boot-docker-compose starts the container on `spring-boot:run` and wires the
# datasource automatically, so no spring.datasource.* properties are needed here.
# Tests skip Docker Compose and use embedded H2 (test scope) instead.

# No migrations yet: Hibernate keeps the schema in sync and data survives restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
